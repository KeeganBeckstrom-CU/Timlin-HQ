<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timlin HQ">
<meta name="theme-color" content="#0e0f12">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Timlin HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a modern family app — quick, upbeat, a little game-like for the kids
   IDEA: a team locker-room scoreboard: what's next, who's driving, who's winning chores this week
   PICTURE: the "Up next" countdown card at the top of Today, then the day as a timeline with a live "now" line
   COLOUR and TYPE: graphite ground (never white), one hot electric blue-to-cyan gradient accent, red-pink only for needs-attention, mint for done; team colours carry each person/event; Plus Jakarta Sans
   LAYOUT: app shell — greeting, hero, stat tiles, timeline; floating pill tab bar; one column on phones */
:root{color-scheme:light dark;--bg:light-dark(#e3ded6,#0e0f12);--card:light-dark(#eeeae3,#17191e);--card2:light-dark(#e0dad1,#20232a);--ink:light-dark(#16171b,#f5f3ef);--mute:light-dark(#69645d,#989aa3);--line:light-dark(#d1cbc1,#272a32);--acc:#3d6bff;--acc2:#21c2ff;--grad:linear-gradient(135deg,#3d6bff,#21c2ff);--hot:#ff4d6d;--ok:#21c79a;--warn:#ffb020;--blu:#4b7bff;--gry:#9a9ba3;--mx:42%;--r:22px}
:root[data-theme=light]{color-scheme:light;--mx:22%}:root[data-theme=dark]{color-scheme:dark;--mx:42%}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--mx:22%}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button,a,label,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:12px}
small{font-size:.72em;font-weight:600;opacity:.8;margin-left:1px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hrow{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.02em;flex:1;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mark{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:11px;overflow:hidden;background:#0e0f12;box-shadow:0 0 0 1px var(--line),0 6px 16px rgba(61,107,255,.3)}
.mark img{width:100%;height:100%;object-fit:contain}
.sync{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--warn)}.sync.live b{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.av{--c:#888;--c2:transparent;width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--c2);color:#fff;display:inline-grid;place-items:center;font-weight:800;font-size:13px;flex:none;text-shadow:0 1px 1px rgba(0,0,0,.4);overflow:hidden}
.av img{width:86%;height:86%;object-fit:contain}
.av.sm{width:26px;height:26px;font-size:10px;box-shadow:0 0 0 1.5px var(--c2)}
.me{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 4px 4px 12px;border-radius:24px;background:var(--card);font-weight:700;font-size:14px}
.addb{width:44px;height:44px;border-radius:15px;background:var(--grad);color:#fff;font-size:26px;font-weight:600;line-height:1;flex:none;box-shadow:0 6px 16px rgba(61,107,255,.42)}
h1{font-size:clamp(30px,8vw,42px);line-height:1.05;margin:14px 0 4px;letter-spacing:-.03em;text-wrap:balance;font-weight:800}
h2{font-size:19px;margin:28px 0 10px;letter-spacing:-.015em;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 small{font-size:13px;color:var(--mute);font-weight:600}
.sub{color:var(--mute);margin:0 0 14px;font-weight:500}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px 18px 16px;margin:6px 0 12px;background:var(--grad);color:#fff;box-shadow:0 14px 34px color-mix(in srgb,var(--t1,#3d6bff) 35%,transparent)}
.hero.th{background:linear-gradient(135deg,var(--t1) 0%,color-mix(in srgb,var(--t1) 70%,var(--t2)) 100%)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .lbl{font-size:12.5px;font-weight:800;letter-spacing:.02em;opacity:.85}
.hero .big{font-size:clamp(34px,10vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:4px 0 2px}
.hero .what{font-size:17px;font-weight:700}
.hero .meta{font-size:14px;opacity:.9;margin-top:2px}
.hero .ppl{margin-top:10px}.hero .chip{background:rgba(255,255,255,.18);color:#fff}
.hero .badge{top:16px;right:16px;z-index:1}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 12px 10px;text-align:left;display:grid;gap:2px}
.stat b{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--mute);font-weight:600}
.stat.hot{background:linear-gradient(135deg,#ff4d6d,#ff7a8f);border-color:transparent;color:#fff}.stat.hot span{color:rgba(255,255,255,.85)}
.strip{display:grid;grid-template-columns:32px repeat(7,minmax(0,1fr)) 32px;gap:4px;margin:6px 0 14px}
.strip button{min-height:58px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:16px;line-height:1.1;padding:4px 0}
.strip .d{background:var(--card)}.strip .d span{font-size:11px;color:var(--mute);font-weight:700}
.strip .d.on{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(61,107,255,.38)}.strip .d.on span{color:rgba(255,255,255,.85)}
.strip .d.today:not(.on){box-shadow:inset 0 0 0 2px var(--acc)}
.strip .d em{display:block;width:5px;height:5px;border-radius:50%;background:var(--acc);margin-top:3px}.strip .d.on em{background:#fff}.strip .d em.x{visibility:hidden}
.strip .nav{font-size:22px;color:var(--mute)}
.alert{border-radius:18px;padding:12px 14px;margin:0 0 10px;display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:15px}
.alert.need{background:color-mix(in srgb,var(--hot) 14%,var(--card));box-shadow:inset 0 0 0 1.5px var(--hot)}.alert.need>span{color:var(--hot)}
.alert.clash{background:color-mix(in srgb,var(--warn) 18%,var(--card));box-shadow:inset 0 0 0 1.5px var(--warn)}.alert.clash>span{color:var(--warn)}
.alert>div{flex:1}.alert ul{margin:4px 0 0;padding-left:18px;font-weight:500}
.tl{display:grid;gap:10px}
.now{display:flex;align-items:center;gap:8px;color:var(--acc);font-size:12.5px;font-weight:800;margin:2px 0}
.now::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent)}
.now::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--acc),transparent)}
.ev{--t1:var(--line);--t2:var(--line);display:grid;grid-template-columns:76px minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.ev.past{opacity:.5}
.ev.th{background:linear-gradient(135deg,color-mix(in srgb,var(--t1) var(--mx),var(--card)) 0%,var(--card) 68%);border-color:color-mix(in srgb,var(--t1) 40%,var(--line))}
.ev .t{padding:14px 0 14px 14px;font-weight:800;font-size:20px;line-height:1;white-space:nowrap}
.ev .t div+div{font-size:12.5px;color:var(--mute);font-weight:600;margin-top:6px}
.ev .b{padding:12px 14px 12px 12px;border-left:4px solid var(--t1);box-shadow:inset 3px 0 0 var(--t2)}
.ev .ti{font-weight:800;font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;text-align:left;letter-spacing:-.01em}
.ev.th .ti,.ev.th .tname{padding-right:54px}
.badge{position:absolute;top:10px;right:10px;width:46px;height:46px;border-radius:14px;background:var(--t1);box-shadow:inset 0 0 0 2px var(--t2),0 4px 10px rgba(0,0,0,.25);display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.02em;color:#fff;overflow:hidden;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.badge img{width:86%;height:86%;object-fit:contain}
.tname{font-size:12.5px;font-weight:800;color:color-mix(in srgb,var(--t2) 70%,var(--ink));margin-top:1px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--mute)}
.ppl{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
.chip{--c:#888;display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 3px;border-radius:20px;background:color-mix(in srgb,var(--c) 24%,transparent);font-size:13px;font-weight:700}
.chip .av{width:20px;height:20px;font-size:9px;box-shadow:0 0 0 1.5px var(--c2)}
.plc{color:var(--mute);font-size:14px}
.go{font-size:13.5px;font-weight:700;margin-top:6px;color:var(--mute)}.go b{color:var(--ink)}
.legs{display:grid;gap:6px;margin-top:10px}
.leg{display:flex;align-items:center;gap:8px;min-height:50px;padding:8px 8px 8px 12px;border-radius:16px;background:color-mix(in srgb,var(--card2) 80%,transparent);width:100%;text-align:left}
.leg .k{display:grid;gap:1px;flex:1}
.leg .k b{font-size:14px}.leg .k span{font-size:12.5px;color:var(--mute);font-weight:600}
.leg .w{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-weight:700;font-size:14px;flex-wrap:wrap}
.leg.open{box-shadow:inset 0 0 0 2px var(--hot)}
.leg.bad{box-shadow:inset 0 0 0 2px var(--warn)}
.need{color:var(--hot);font-weight:800}
.take{background:var(--grad);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.btn{min-height:46px;padding:10px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:800}
.btn.ghost{background:var(--card2);color:var(--ink)}.btn.red{background:#d9372b;color:#fff}.btn.acc{background:var(--grad);color:#fff}
.dinner{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px}
.dinner button{display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--mute);min-height:64px}
.dinner span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dinner .av{opacity:.35}.dinner .home .av{opacity:1;box-shadow:0 0 0 3px var(--ok)}.dinner .late .av{opacity:1;box-shadow:0 0 0 3px var(--warn)}.dinner .out .av{opacity:.3;filter:grayscale(1)}
.dinner .home{color:var(--ok)}.dinner .late{color:var(--warn)}
.cnt{font-weight:800;color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px}.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;min-height:40px;padding:6px 14px;border-radius:20px;background:var(--card);font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg .av{width:22px;height:22px;font-size:9px}
.day{margin:20px 0 8px;font-weight:800;font-size:15px;display:flex;justify-content:space-between;color:var(--mute)}
.day.td{color:var(--acc)}
.row{--t1:var(--line);display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:6px;width:100%;text-align:left;min-height:54px;border-left:5px solid var(--t1)}
.row .tm{font-weight:800;white-space:nowrap;font-size:15px}
.row .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:3px;align-items:center}.dots i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.row .nm.two{display:flex;flex-direction:column;gap:2px;white-space:normal}.row .nm .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--mute)}.dl em{font-style:normal;white-space:nowrap}.dl em b{color:var(--ink)}.dl em.o,.dl em.o b{color:var(--hot)}
.ri{font-size:12px;font-weight:800;padding:3px 8px;border-radius:20px;white-space:nowrap}
.ri.o{background:var(--hot);color:#fff}.ri.f{background:var(--card2);color:var(--mute)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.li{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 8px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .x{flex:1;text-align:left}.li .x b{font-weight:700}.li.done .x b{text-decoration:line-through;color:var(--mute)}
.li .x span{display:block;font-size:12.5px;color:var(--mute)}
.li .x span.late{color:var(--hot);font-weight:700}
.li small{color:var(--mute);font-weight:500}
.cb{width:30px;height:30px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;flex:none;font-weight:900;transition:transform .15s}
.cb:active{transform:scale(.85)}
.done .cb{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.pts{font-size:12px;font-weight:800;padding:3px 8px;border-radius:20px;background:var(--card2);white-space:nowrap}
.how{font-size:12px;font-weight:800;padding:6px 10px;border-radius:20px;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);white-space:nowrap}
.del{color:var(--mute);font-size:20px;width:36px;height:36px;border-radius:10px}
.add{display:flex;gap:8px;margin:8px 0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:16px}
input[type=date],input[type=time]{display:block;-webkit-appearance:none;appearance:none;text-align:left}
input[type=color]{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card2);padding:4px}
textarea{min-height:76px;resize:vertical}
.note{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.note p{margin:0;flex:1;white-space:pre-wrap}.note .by{font-size:12px;color:var(--mute);display:block;margin-top:2px}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sc{--c:#888;position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px 12px;display:grid;justify-items:center;gap:6px;text-align:center}
.sc.lead{border-color:var(--acc2);box-shadow:0 8px 22px rgba(33,194,255,.22)}
.sc .crown{position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:20px;background:var(--grad);color:#fff}
.ring{--p:0;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--card2) 0)}
.ring>span{width:62px;height:62px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.ring .av{width:46px;height:46px;font-size:16px}
.sc b{font-size:15px}.sc .p{font-size:22px;font-weight:800;line-height:1}.sc .p small{font-size:11px;color:var(--mute)}
.sc .d{font-size:12px;color:var(--mute);font-weight:600}
.teams{display:grid;gap:8px}
.trow{--t1:#555;--t2:#999;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:linear-gradient(110deg,color-mix(in srgb,var(--t1) var(--mx),var(--card)),var(--card) 75%);text-align:left;min-height:66px;position:relative;border:1px solid var(--line)}
.trow .badge{position:static;flex:none}
.trow .x{flex:1}.trow .x span{display:block;font-size:13px;color:var(--mute);font-weight:600}
.sw{display:inline-flex;gap:4px}.sw i{width:16px;height:16px;border-radius:5px;background:var(--c)}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;width:min(560px,calc(100% - 20px));background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:6px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
nav.tabs button{min-height:54px;border-radius:20px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--mute);position:relative;transition:background .2s,color .2s}
nav.tabs button.on{background:var(--grad);color:#fff}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .bd{position:absolute;top:3px;left:calc(50% + 6px);background:var(--hot);color:#fff;font-size:10.5px;font-weight:800;border-radius:9px;padding:0 6px;min-width:18px;box-shadow:0 0 0 2px var(--card)}
nav.tabs button.on .bd{background:#fff;color:var(--hot)}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(6,6,9,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;overscroll-behavior:contain;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:up .24s ease-out}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 14px}
@media(min-width:620px){.scrim{align-items:center}.sheet{border-radius:28px}.sheet::before{display:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet,.done .cb{animation:none}}
.sheet h3{margin:0 0 14px;font-size:24px;letter-spacing:-.02em}
.sheet .xbtn{position:sticky;top:0;float:right;z-index:3;width:44px;height:44px;margin:-6px -6px 6px 10px;border-radius:50%;background:var(--card2);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 1px var(--line),0 4px 12px rgba(0,0,0,.25)}
.sheet .xbtn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;fill:none}
.f{margin-bottom:14px}.f>label,.f>.lb{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{min-height:42px;padding:4px 12px 4px 4px;border-radius:22px;background:var(--card);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;opacity:.5}
.pick button.on{opacity:1;box-shadow:inset 0 0 0 2px var(--acc)}
.pick.days button{padding:4px 12px;min-width:48px;justify-content:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.acts .btn{flex:1}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.who button.lockd{opacity:.5;cursor:not-allowed}

    const id = f._id || uid("e"), out = {...f, title: f.title.trim(), travel: f.travel === "" ? "" : +f.travel, early: f.early === "" ? "" : +f.early};
    delete out._id; delete out._d; delete out._auto; delete out.leave; delete out._tpl; delete out.src;
    if (out.driverTo === "__custom") out.driverTo = ""; if (out.driverFrom === "__custom") out.driverFrom = "";
    const er = effRide(out, out.date);
    if (er === "none" || er === "from") out.driverTo = "";
    if (er === "none" || er === "to") out.driverFrom = "";
    if (out.repeat !== "weekly") { out.days = []; out.until = ""; }
    put("events", id, out);
    if (out.place && out.travel !== "" && places()[out.place] !== out.travel) put("settings", "main", {...main(), places: {...places(), [out.place]: out.travel}});
    if (!f._id) sel = out.date; close(); return;
  }
  if (D.skip !== undefined) { const id = form._id, e = S.events[id], d = form._d; put("events", id, {...e, skip: [...(e.skip || []), d]}); close(); undo(`Skipped ${e.title} on ${dayLabel(d)}`, () => put("events", id, e)); return; }
  if (D.delev !== undefined) { const id = form._id, e = S.events[id]; del("events", id); close(); undo(`Deleted ${e.title}`, () => put("events", id, e)); return; }
});
document.addEventListener("change", async ev => {
  const id = ev.target.id;
  if (id === "jumpD" && ev.target.value) { sel = ev.target.value; render(); return; }
  if (cform && id === "cR") { grabChore(); drawChore(); }
  if (form && ["fR", "fRide", "fTeam", "fC", "fDT", "fDF"].includes(id)) { if (id === "fTeam") form._auto = false; grab(); if (id === "fC" && form._auto) form.team = autoTeam(form); drawForm(); }
  if (id === "appLogo" && ev.target.files[0]) {
    try { const lg = await processLogo(ev.target.files[0], true); put("settings", "main", {...main(), logo: lg}); } catch (e) { flash("Couldn't read that image"); }
  }
  if (tform && id === "tLogo" && ev.target.files[0]) {
    grabTeam();
    try { tform.logo = await processLogo(ev.target.files[0], tform._strip); } catch (e) { flash("Couldn't read that image"); }
    drawTeam();
  }
});
document.addEventListener("input", ev => {
  if (form && !form._id && ev.target.id === "fT") {
    const v = norm(ev.target.value), tpl = v && Object.values(S.events).filter(x => x && norm(x.title) === v).sort((a, b) => (b.date || "").localeCompare(a.date || ""))[0];
    if (tpl && form._tpl !== v) { grab(); form._tpl = v; ["title", "who", "cat", "start", "end", "place", "ride", "driverTo", "driverFrom", "travel", "early", "team", "notes"].forEach(k => { if (tpl[k] !== undefined) form[k] = JSON.parse(JSON.stringify(tpl[k])); }); form._auto = false; drawForm(); flash("Filled in from last time"); }
  }
  if (form && ev.target.id === "fP") { const m = places()[ev.target.value.trim()], tr = $("#fTr"); if (m != null && tr && !tr.value) tr.value = m; }
});
document.addEventListener("mousedown", ev => { if (ev.target.id === "scrim") close(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") close(); });
document.addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id === "gAdd") { const v = $("#gIn").value.trim(); if (v) put("grocery", uid("g"), { text: v, by: me || "", done: false, ts: Date.now() }); }
  if (ev.target.id === "nAdd") { const v = $("#nIn").value.trim(); if (v) put("notes", uid("n"), { text: v, by: me || "", ts: Date.now() }); }
});

let tx = null;
document.addEventListener("touchstart", ev => { const t0 = ev.touches[0]; tx = $("#modal").innerHTML || ev.target.closest(".seg,.strip,input,textarea,select,.score") ? null : { x: t0.clientX, y: t0.clientY }; }, { passive: true });
document.addEventListener("touchend", ev => {
  if (!tx || !["today", "chores", "week"].includes(tab)) return; const t1 = ev.changedTouches[0], dx = t1.clientX - tx.x, dy = t1.clientY - tx.y; tx = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
  sel = addD(sel, (dx < 0 ? 1 : -1) * (tab === "week" ? 7 : 1)); render();
}, { passive: true });
let lastDay = todayK();
boot();
if (!me) setTimeout(() => { if (!me) whoSheet(); }, 300);
setInterval(() => { if (todayK() !== lastDay) { if (sel === lastDay) sel = todayK(); lastDay = todayK(); } const ae = document.activeElement; if (tab === "today" && !$("#modal").innerHTML && !(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render(); }, 60000);
}
