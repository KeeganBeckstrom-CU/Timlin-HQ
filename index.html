<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timlin HQ">
<meta name="theme-color" content="#17161d">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Timlin HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, quick, kitchen-table practical — read in 3 seconds on the way out the door
   IDEA: the family car-key hook + a locker room of team colours: every event wears its team's jersey
   PICTURE: the day timeline itself — big hanging times, team-coloured cards with the team badge, ride legs with leave/arrive times
   COLOUR and TYPE: deep charcoal-plum ground (never white); each person/event takes its team's two colours; coral accent for "needs action"; Figtree
   LAYOUT: app shell — header, date strip, timeline, five-tab bar, one + button; one column on phones */
:root{color-scheme:light dark;--bg:light-dark(#e6d8c6,#17161d);--card:light-dark(#efe4d5,#22202a);--card2:light-dark(#e0d0bc,#2d2a36);--ink:light-dark(#1f1a20,#f3eee8);--mute:light-dark(#6e6168,#a29ca9);--line:light-dark(#cdbba5,#373340);--acc:#ff5a36;--warn:#f0a020;--ok:#2fbf71;--mx:34%}
:root[data-theme=light]{color-scheme:light;--mx:16%}:root[data-theme=dark]{color-scheme:dark;--mx:34%}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--mx:16%}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:10px}
small{font-size:.72em;font-weight:600;opacity:.8;margin-left:1px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
.hrow{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;flex:1;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{display:inline-block;width:14px;height:22px;border-radius:7px 7px 3px 3px;background:var(--acc);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.sync{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--warn)}.sync.live b{background:var(--ok)}
@media(max-width:420px){.sync span{display:none}}
.av{--c:#888;--c2:transparent;width:34px;height:34px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--c2);color:#fff;display:inline-grid;place-items:center;font-weight:800;font-size:13px;flex:none;text-shadow:0 1px 1px rgba(0,0,0,.4);overflow:hidden}
.av img{width:86%;height:86%;object-fit:contain}
.av.sm{width:24px;height:24px;font-size:10px;box-shadow:0 0 0 1.5px var(--c2)}
.me{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 6px 4px 12px;border-radius:24px;background:var(--card);font-weight:600;font-size:14px}
h1{font-size:clamp(30px,8vw,44px);line-height:1.05;margin:18px 0 4px;letter-spacing:-.025em;text-wrap:balance}
h2{font-size:20px;margin:26px 0 10px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 14px}
.strip{display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr)) 40px;gap:4px;margin:6px 0 14px}
.strip button{min-height:56px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:15px;line-height:1.1;padding:4px 0}
.strip .d{background:var(--card)}.strip .d span{font-size:11px;color:var(--mute);font-weight:600}
.strip .d.on{background:var(--ink);color:var(--bg)}.strip .d.on span{color:inherit;opacity:.7}
.strip .d.today:not(.on){box-shadow:inset 0 0 0 2px var(--acc)}
.strip .d em{display:block;width:5px;height:5px;border-radius:50%;background:var(--acc);margin-top:2px}.strip .d em.x{visibility:hidden}
.strip .nav{font-size:22px;color:var(--mute)}
.alert{border-radius:16px;padding:12px 14px;margin:0 0 10px;display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:15px}
.alert.need{background:var(--acc);color:#fff}.alert.clash{background:var(--warn);color:#241600}
.alert>div{flex:1}.alert ul{margin:4px 0 0;padding-left:18px;font-weight:500}
.tl{display:grid;gap:10px}
.ev{--t1:var(--line);--t2:var(--line);display:grid;grid-template-columns:74px minmax(0,1fr);background:var(--card);border-radius:18px;overflow:hidden;position:relative}
.ev.th{background:linear-gradient(115deg,color-mix(in srgb,var(--t1) var(--mx),var(--card)) 0%,var(--card) 72%)}
.ev .t{padding:14px 0 14px 14px;font-weight:800;font-size:21px;line-height:1;white-space:nowrap}
.ev .t div+div{font-size:13px;color:var(--mute);font-weight:600;margin-top:6px}
.ev .b{padding:12px 14px 12px 10px;border-left:6px solid var(--t1);box-shadow:inset 3px 0 0 var(--t2)}
.ev .ti{font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;text-align:left}
.ev.th .ti,.ev.th .tname{padding-right:54px}
.badge{position:absolute;top:10px;right:10px;width:46px;height:46px;border-radius:12px;background:var(--t1);box-shadow:inset 0 0 0 2px var(--t2);display:grid;place-items:center;font-weight:900;font-size:12px;letter-spacing:.02em;color:#fff;overflow:hidden;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.badge img{width:86%;height:86%;object-fit:contain}
.tname{font-size:12.5px;font-weight:800;color:color-mix(in srgb,var(--t2) 70%,var(--ink));margin-top:1px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--card2);color:var(--mute)}
.ppl{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
.chip{--c:#888;display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 3px;border-radius:20px;background:color-mix(in srgb,var(--c) 26%,transparent);font-size:13px;font-weight:600}
.chip .av{width:20px;height:20px;font-size:9px;box-shadow:0 0 0 1.5px var(--c2)}
.plc{color:var(--mute);font-size:14px}
.go{font-size:13.5px;font-weight:700;margin-top:6px;color:var(--mute)}.go b{color:var(--ink)}
.legs{display:grid;gap:6px;margin-top:10px}
.leg{display:flex;align-items:center;gap:8px;min-height:50px;padding:7px 8px 7px 10px;border-radius:12px;background:var(--card2);width:100%;text-align:left}
.leg .k{display:grid;gap:1px;flex:1}
.leg .k b{font-size:14px}.leg .k span{font-size:12.5px;color:var(--mute);font-weight:600}
.leg .w{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-weight:700;font-size:14px;flex-wrap:wrap}
.leg.open{box-shadow:inset 0 0 0 2px var(--acc)}
.leg.bad{box-shadow:inset 0 0 0 2px var(--warn)}
.need{color:var(--acc);font-weight:800}
.take{background:var(--acc);color:#fff;border-radius:10px;padding:7px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.empty{background:var(--card);border-radius:18px;padding:22px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.btn{min-height:44px;padding:10px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700}
.btn.ghost{background:var(--card2);color:var(--ink)}.btn.red{background:#d63b2b;color:#fff}.btn.acc{background:var(--acc);color:#fff}
.dinner{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;background:var(--card);border-radius:18px;padding:12px 8px}
.dinner button{display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--mute);min-height:64px}
.dinner .av{opacity:.35}.dinner .home .av{opacity:1}.dinner .late .av{opacity:1;box-shadow:0 0 0 3px var(--warn)}.dinner .out .av{opacity:.35;filter:grayscale(1)}
.dinner .home{color:var(--ok)}.dinner .late{color:var(--warn)}
.cnt{font-weight:800;color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.seg button{min-height:40px;padding:6px 14px;border-radius:20px;background:var(--card);font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg .av{width:22px;height:22px;font-size:9px}
.day{margin:18px 0 6px;font-weight:800;font-size:15px;display:flex;justify-content:space-between;color:var(--mute)}
.day.td{color:var(--acc)}
.row{--t1:var(--line);display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:6px;width:100%;text-align:left;min-height:52px;border-left:5px solid var(--t1)}
.row .tm{font-weight:800;white-space:nowrap;font-size:15px}
.row .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:3px;align-items:center}.dots i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.ri{font-size:12px;font-weight:800;padding:3px 7px;border-radius:8px;white-space:nowrap}
.ri.o{background:var(--acc);color:#fff}.ri.f{background:var(--card2);color:var(--mute)}
.list{background:var(--card);border-radius:18px;padding:6px}
.li{display:flex;align-items:center;gap:10px;min-height:52px;padding:4px 8px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .x{flex:1;text-align:left}.li.done .x b{text-decoration:line-through;color:var(--mute)}
.li .x span{display:block;font-size:12.5px;color:var(--mute)}
.li small{color:var(--mute);font-weight:500}
.cb{width:28px;height:28px;border-radius:8px;border:2px solid var(--mute);display:grid;place-items:center;flex:none;font-weight:900}
.done .cb{background:var(--ok);border-color:var(--ok);color:#fff}
.pts{font-size:12px;font-weight:800;padding:2px 7px;border-radius:8px;background:var(--card2);white-space:nowrap}
.del{color:var(--mute);font-size:20px;width:36px;height:36px;border-radius:10px}
.add{display:flex;gap:8px;margin:8px 0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:16px}
input[type=color]{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:4px}
textarea{min-height:70px;resize:vertical}
.note{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.note p{margin:0;flex:1;white-space:pre-wrap}.note .by{font-size:12px;color:var(--mute);display:block;margin-top:2px}
.lbd{display:grid;gap:8px;background:var(--card);border-radius:18px;padding:14px}
.lbr{display:grid;grid-template-columns:118px minmax(0,1fr) 44px;gap:10px;align-items:center;font-weight:700;font-size:14px}
.lbr .n{display:flex;gap:8px;align-items:center}
.bar{height:14px;border-radius:7px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;border-radius:7px;background:var(--c);box-shadow:inset -3px 0 0 var(--c2)}
.lbr .v{text-align:right;font-variant-numeric:tabular-nums}
.teams{display:grid;gap:8px}
.trow{--t1:#555;--t2:#999;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:linear-gradient(110deg,color-mix(in srgb,var(--t1) var(--mx),var(--card)),var(--card) 75%);text-align:left;min-height:64px;position:relative}
.trow .badge{position:static;flex:none}
.trow .x{flex:1}.trow .x span{display:block;font-size:13px;color:var(--mute);font-weight:600}
.sw{display:inline-flex;gap:4px}.sw i{width:16px;height:16px;border-radius:5px;background:var(--c)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{min-height:52px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--mute);position:relative}
nav.tabs button.on{color:var(--ink)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .bd{position:absolute;top:4px;left:calc(50% + 6px);background:var(--acc);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;min-width:18px}
.addb{width:44px;height:44px;border-radius:14px;background:var(--acc);color:#fff;font-size:28px;font-weight:600;line-height:1;flex:none;box-shadow:0 4px 12px rgba(255,90,54,.35)}
.fab{position:fixed;right:max(18px,calc(50% - 362px));bottom:calc(80px + env(safe-area-inset-bottom));z-index:7;width:60px;height:60px;border-radius:20px;background:var(--acc);color:#fff;font-size:32px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,8,14,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@media(min-width:620px){.scrim{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 14px;font-size:22px}
.f{margin-bottom:14px}.f>label,.f>.lb{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{min-height:42px;padding:4px 12px 4px 4px;border-radius:22px;background:var(--card);font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;opacity:.5}
.pick button.on{opacity:1;box-shadow:inset 0 0 0 2px var(--ink)}
.pick.days button{padding:4px 12px;min-width:48px;justify-content:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.acts .btn{flex:1}
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.who button{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--card);font-weight:700;min-height:56px}
.set{background:var(--card);border-radius:18px;padding:14px}
.set p{margin:0 0 10px;color:var(--mute);font-size:14px}
.ex{font-size:12.5px;color:var(--mute);margin:6px 0 0}
.lprev{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lprev .badge{position:static;width:72px;height:72px;border-radius:18px;font-size:18px}
.file{display:inline-flex;align-items:center;min-height:44px;padding:10px 16px;border-radius:14px;background:var(--card2);font-weight:700;cursor:pointer}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-height:40px}
.ck input{width:20px;height:20px}
.hide{display:none!important}

/* phone polish */
button,a,label,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
input[type=date],input[type=time]{display:block;-webkit-appearance:none;appearance:none;text-align:left}
.sheet{max-height:92dvh;overscroll-behavior:contain}
.seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}.seg::-webkit-scrollbar{display:none}.seg button{flex:none}
.dinner span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:440px){
  header{padding-inline:12px}
  .brand{font-size:19px}
  .me .nm{display:none}.me{padding:4px}
  h1{margin-top:14px}
  .wrap{padding-inline:12px}
  .strip{grid-template-columns:28px repeat(7,minmax(0,1fr)) 28px;gap:3px}
  .strip button{min-height:52px;font-size:14px;border-radius:12px}
  .ev{grid-template-columns:68px minmax(0,1fr);border-radius:16px}
  .ev .t{font-size:16px;padding:12px 2px 12px 8px}
  .ev .t small{font-size:.7em}
  .ev .t div+div{font-size:12px}
  .ev .b{padding:10px 10px 10px 8px}
  .ev .ti{font-size:16px}
  .badge{width:38px;height:38px;top:8px;right:8px;font-size:10px;border-radius:10px}
  .ev.th .ti,.ev.th .tname{padding-right:44px}
  .leg{flex-wrap:wrap;gap:6px}
  .leg .k{flex-basis:100%}
  .leg .w{width:100%}
  .dinner{gap:2px;padding:10px 4px}
  .dinner button{font-size:10px}
  .dinner .av{width:30px;height:30px;font-size:11px}
  .lbr{grid-template-columns:96px minmax(0,1fr) 34px}
  .row{grid-template-columns:54px minmax(0,1fr) auto;padding:10px}
  .two{gap:8px}
  .who{grid-template-columns:repeat(2,minmax(0,1fr))}
  .addb{width:44px;height:44px;border-radius:14px;background:var(--acc);color:#fff;font-size:28px;font-weight:600;line-height:1;flex:none;box-shadow:0 4px 12px rgba(255,90,54,.35)}
.fab{width:56px;height:56px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom))}
  nav.tabs button{font-size:11px}
}
</style>
</head>
<body>
<header><div class="hrow">
  <div class="brand"><i aria-hidden="true"></i>Timlin HQ</div>
  <div class="sync" id="sync"><b></b><span>Connecting…</span></div>
  <button class="addb" id="fab" aria-label="Add">+</button>
  <button class="me" id="meBtn" aria-label="Switch who you are"></button>
</div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" id="tabs">
  <button data-t="today"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Today</button>
  <button data-t="rides"><svg viewBox="0 0 24 24"><path d="M5 16l1.5-6A2 2 0 0 1 8.4 8.5h7.2a2 2 0 0 1 1.9 1.5L19 16"/><rect x="3" y="15" width="18" height="4" rx="1.5"/><circle cx="7" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>Rides</button>
  <button data-t="chores"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></svg>Chores</button>
  <button data-t="week"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Week</button>
  <button data-t="house"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>House</button>
</nav>
<div id="modal"></div>
<script>
{
// ---- For the GitHub Pages version: paste your Supabase project URL + anon key (see README) ----
const SUPABASE_URL = "";
const SUPABASE_KEY = "";

const FAM = ["Keegan","Brady","Grayson","Duggan","Decker","Mom","Dad"];
const FALL = {Keegan:"#ff5a36",Brady:"#2f8cff",Grayson:"#13a89a",Duggan:"#e2a400",Decker:"#9a62ff",Mom:"#ef3f8f",Dad:"#5f86ad"};
const INI = {Keegan:"K",Brady:"B",Grayson:"G",Duggan:"Dg",Decker:"Dk",Mom:"M",Dad:"D"};
// Team colours: Cleary from cleary athletics branding; SLE black & silver (MHSAA); BigDawgz purple/gold; Wolves estimated — edit in House → Teams
const DEF_TEAMS = {
  cleary:   {name:"Cleary Cougars", short:"CU", who:"Keegan", c1:"#002B5C", c2:"#B30838"},
  sle:      {name:"South Lyon East Cougars", short:"SLE", who:"Brady", c1:"#18181b", c2:"#A8A9AD"},
  bigdawgz: {name:"BigDawgz 12U", short:"BD", who:"Decker", c1:"#421480", c2:"#AC7519"},
  wolves:   {name:"White Lake Wolves", short:"WLW", who:"Duggan", c1:"#1F4FA3", c2:"#A7B1BC"},
  tigers:   {name:"Detroit Tigers", short:"TGR", who:"Mom", c1:"#0C2340", c2:"#FA4616"},

const chain = {};

  const k = c + "/" + id;
  chain[k] = (chain[k] || Promise.resolve()).then(() => api && api.put(c, id, data)).catch(err => flash("Couldn't save — " + (err && err.message || "try again")));

}
function del(c, id) {

  const k = c + "/" + id;

}
function setSync(isLive, txt) { live = isLive; const s = $("#sync"); s.className = "sync" + (isLive ? " live" : ""); s.querySelector("span").textContent = txt; }
function localApi() {
  try { const raw = localStorage.getItem("bhq-data"); if (raw) { const d = JSON.parse(raw); COLLS.forEach(c => { if (d[c]) S[c] = d[c]; }); } } catch (e) {}
  const save = () => { try { localStorage.setItem("bhq-data", JSON.stringify(S)); } catch (e) { flash("Phone storage is full"); } };

}
async function claudeApi() {
  const db = await window.claude.use("db");

  const timer = setTimeout(() => { if (!live) setSync(false, "Can't reach data yet"); }, 10000);
  COLLS.forEach(c => db.collection(c).onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); }); S[c] = o;
    if (!snap.metadata.fromCache) { clearTimeout(timer); setSync(true, "Live · shared"); }
    render();
  }, () => { clearTimeout(timer); setSync(false, "Offline"); }));
  return { put: (c, id, d) => db.collection(c).doc(id).set(d), del: (c, id) => db.collection(c).doc(id).delete() };
}
async function supaApi() {
  await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const load = async () => {
    const { data, error } = await sb.from("hub").select("coll,id,data");
    if (error) throw error;
    COLLS.forEach(c => S[c] = {});
    data.forEach(r => { if (S[r.coll]) S[r.coll][r.id] = r.data; });
    setSync(true, "Live · shared"); render();
  };
  await load();
  sb.channel("hub").on("postgres_changes", { event: "*", schema: "public", table: "hub" }, p => {
    if (p.eventType === "DELETE") { const o = p.old; if (S[o.coll]) { const n = {...S[o.coll]}; delete n[o.id]; S[o.coll] = n; } }
    else { const r = p.new; if (S[r.coll]) S[r.coll] = {...S[r.coll], [r.id]: r.data}; }
    render();
  }).subscribe();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load().catch(() => setSync(false, "Offline")); });
  return {
    put: async (c, id, d) => { const { error } = await sb.from("hub").upsert({ coll: c, id, data: d, updated_at: new Date().toISOString() }); if (error) throw error; },
    del: async (c, id) => { const { error } = await sb.from("hub").delete().match({ coll: c, id }); if (error) throw error; }

}

// ---------- schedule + travel logic ----------
function occ(d) {
  const dow = parse(d).getDay(), out = [];
  for (const [id, e] of Object.entries(S.events)) {
    if (!e || !e.title) continue;
    const on = e.repeat === "weekly" ? (e.days || []).includes(dow) && d >= e.date && (!e.until || d <= e.until) : e.date === d;
    if (on && !(e.skip || []).includes(d)) out.push({ id, e, d });

}
const num = (v, dflt) => (v === "" || v == null || isNaN(+v)) ? dflt : +v;

function legsOf(o) {

  const s = mins(o.e.start), en = mins(o.e.end) ?? (s != null ? s + 60 : null);
  const drv = k => (k in r) ? r[k] : ((k === "to" ? o.e.driverTo : o.e.driverFrom) || "");
  if ((n === "to" || n === "both") && s != null) { const arrive = s - early; L.push({ o, k: "to", driver: drv("to"), depart: arrive - travel, arrive, home: arrive + travel, travel }); }
  if ((n === "from" || n === "both") && en != null) L.push({ o, k: "from", driver: drv("from"), depart: en - travel, arrive: en, home: en + travel, travel });
  return L;
}

const overlap = (a1, a2, b1, b2) => a1 < b2 && b1 < a2;
function clashes(d) {
  const os = occ(d), legs = os.flatMap(legsOf).filter(l => l.driver), out = [], by = {};
  legs.forEach(l => (by[l.driver] = by[l.driver] || []).push(l));
  for (const [drv, ls] of Object.entries(by)) {
    ls.sort((a, b) => a.depart - b.depart);
    for (let i = 0; i < ls.length; i++) for (let j = i + 1; j < ls.length; j++) {
      const a = ls[i], b = ls[j];
      if (a.o.id === b.o.id || !overlap(a.depart, a.home, b.depart, b.home)) continue;
      const sameTrip = a.o.e.place && a.o.e.place === b.o.e.place && Math.abs(a.depart - b.depart) <= 10;
      if (!sameTrip) out.push({ msg: `${drv} can't do both: ${legName(a)} (leave ${plainM(a.depart)}) and ${legName(b)} (leave ${plainM(b.depart)})`, keys: [lk(a), lk(b)] });
    }
    for (const l of ls) for (const o of os) {
      if (o.id === l.o.id || !(o.e.who || []).includes(drv)) continue;
      const { early, travel } = timing(o.e), s = mins(o.e.start), e = mins(o.e.end) ?? (s + 60);
      if (s != null && overlap(l.depart, l.home, s - early - travel, e)) out.push({ msg: `${drv} has ${o.e.title} (${plain(o.e.start)}–${plainM(e)}) but is down for ${legName(l)} — leave ${plainM(l.depart)}, back ${plainM(l.home)}`, keys: [lk(l)] });
    }
  }
  return out;
}
const legName = l => `${l.k === "to" ? "drop-off" : "pick-up"} for ${l.o.e.title}`;

// ---------- chores ----------
function choresOn(d) {
  const dow = parse(d).getDay(), out = [];
  for (const [id, c] of Object.entries(S.chores)) {
    if (!c || !c.name || !(c.days || []).includes(dow)) continue;
    const pool = (c.pool || []).filter(n => FAM.includes(n));
    if (!pool.length) continue;
    if (c.rotate === "all") pool.forEach(n => out.push({ id, c, who: n, key: id + ":" + n }));
    else {
      const off = [...id].reduce((a, ch) => a + ch.charCodeAt(0), 0) + (c.order || 0);
      const i = c.rotate === "fixed" ? 0 : ((c.rotate === "weekly" ? weekNum(d) : dayNum(d)) + off) % pool.length;

function processLogo(file, strip) {
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {

      const x = c.getContext("2d"), r = Math.min(N / img.width, N / img.height), w = img.width * r, h = img.height * r;
      x.drawImage(img, (N - w) / 2, (N - h) / 2, w, h); URL.revokeObjectURL(url);
      if (strip) {
        const d = x.getImageData(0, 0, N, N), p = d.data, seen = new Uint8Array(N * N), q = [];
        const light = i => p[i * 4 + 3] < 20 || (p[i * 4] > 225 && p[i * 4 + 1] > 225 && p[i * 4 + 2] > 225);
        for (let i = 0; i < N; i++) q.push(i, (N - 1) * N + i, i * N, i * N + N - 1);
        while (q.length) { const i = q.pop(); if (i < 0 || i >= N * N || seen[i] || !light(i)) continue; seen[i] = 1; p[i * 4 + 3] = 0; const cx = i % N; q.push(i + N, i - N); if (cx > 0) q.push(i - 1); if (cx < N - 1) q.push(i + 1); }
        x.putImageData(d, 0, 0);
      }
      ok(c.toDataURL("image/png"));
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(); };
    img.src = url;
  });
}

    { title: "BigDawgz practice", who: ["Decker"], cat: "Practice", repeat: "weekly", days: [2, 4], date: mon, start: "18:00", end: "20:00", place: "Legacy Center, Brighton", travel: 20, early: 15, ride: "both", driverTo: "Keegan", driverFrom: "", team: "bigdawgz" },
    { title: "Wolves workout", who: ["Duggan"], cat: "Practice", repeat: "weekly", days: [3], date: mon, start: "17:30", end: "19:00", place: "Walled Lake Northern", travel: 10, early: 15, ride: "both", driverTo: "Mom", driverFrom: "Dad", team: "wolves" },
    { title: "Orthodontist", who: ["Grayson"], cat: "Appointment", repeat: "none", date: addD(t, 2), start: "15:30", end: "16:15", place: "", travel: 15, early: 10, ride: "both", driverTo: "Mom", driverFrom: "Mom", team: "" }
  ];
  ev.forEach(e => put("events", uid("x"), { ...e, sample: true, notes: "" }));
  const pl = {...places()}; ev.forEach(e => { if (e.place && pl[e.place] == null) pl[e.place] = e.travel; });
  put("settings", "main", {...main(), places: pl});
  close();
}
function clearSamples() { Object.entries(S.events).forEach(([id, e]) => { if (e.sample) del("events", id); }); }
const KIDS = ["Grayson", "Duggan", "Decker"], BIG = ["Brady", "Grayson"];
const CHORE_PRESET = [
  { name: "Dishes: empty dishwasher + clear the sink", tip: "Put away the clean dishes, then load everything in the sink and start it when full", days: [0, 1, 2, 3, 4, 5, 6], pool: KIDS, rotate: "daily", pts: 3 },
  { name: "Wipe counters & table", tip: "After dinner, crumbs off the floor under the table too", days: [0, 1, 2, 3, 4, 5, 6], pool: KIDS, rotate: "daily", pts: 1 },
  { name: "Your own laundry", tip: "Wash, dry, fold and put away — no piles on the floor", days: [0], pool: ["Brady", "Grayson", "Duggan", "Decker"], rotate: "all", pts: 3 },
  { name: "Towels & sheets load", tip: "One load of bathroom towels or bed sheets, start to finish", days: [3], pool: KIDS, rotate: "weekly", pts: 3 },
  { name: "Trash & recycling to the curb", tip: "All cans in the house emptied first, bins at the curb", days: [0], pool: KIDS, rotate: "weekly", pts: 2 },
  { name: "Clean the kids' bathroom", tip: "Toilet, sink, mirror, wipe the floor, new trash bag", days: [6], pool: KIDS, rotate: "weekly", pts: 4 },
  { name: "Vacuum the main floor", tip: "Living room, kitchen, entryway — move the shoes", days: [6], pool: KIDS, rotate: "weekly", pts: 3 },
  { name: "Clean out a car", tip: "Trash out, gear back inside, quick vacuum (16+)", days: [0], pool: BIG, rotate: "weekly", pts: 3 },
  { name: "Shovel or yard work", tip: "Driveway and walk when it snows; leaves/mowing in season (16+)", days: [6], pool: BIG, rotate: "weekly", pts: 4 },
  { name: "Help cook dinner", tip: "Work with Mom or Dad start to finish (16+)", days: [4], pool: BIG, rotate: "weekly", pts: 4 }
];
function chorePreset() { CHORE_PRESET.forEach((c, i) => put("chores", uid("c"), { ...c, order: i })); }

// ---------- events ----------
document.addEventListener("click", ev => {
  const t = ev.target.closest("button,[data-take]"); if (!t) return;
  const D = t.dataset;
  if (D.take) { ev.stopPropagation(); const [id, d, k] = D.take.split("|"); setDriver(id, d, k, me); return; }
  if (D.t) { tab = D.t; window.scrollTo && window.scrollTo(0, 0); render(); return; }
  if (D.day) { sel = D.day; if (tab === "rides" || tab === "house") tab = "today"; render(); return; }
  if (D.go) { sel = addD(sel, +D.go); render(); return; }
  if (D.rf) { rideF = D.rf; render(); return; }
  if (D.ww) { weekWho = D.ww; render(); return; }
  if (D.leg) { const [id, d, k] = D.leg.split("|"); legSheet(id, d, k); return; }
  if (D.setdrv !== undefined) { const [id, d, k, n] = D.setdrv.split("|"); setDriver(id, d, k, n); close(); return; }
  if (D.edit) { const [id, d] = D.edit.split("|"); editSheet(id, d); return; }
  if (D.add !== undefined) { editSheet(null, sel); return; }
  if (t.id === "fab") { tab === "chores" ? choreSheet(null) : editSheet(null, sel); return; }
  if (D.sample !== undefined) { samples(); return; }
  if (D.clearsample !== undefined) { clearSamples(); return; }
  if (D.whoami !== undefined || t.id === "meBtn") { whoSheet(); return; }
  if (D.iam) { me = D.iam; try { localStorage.setItem("bhq-me", me); } catch (e) {} close(); render(); return; }
  if (D.din) { const doc = {...(S.dinner[sel] || {})}, nx = { "": "home", home: "late", late: "out", out: "" }; doc[D.din] = nx[doc[D.din] || ""]; if (!doc[D.din]) delete doc[D.din]; put("dinner", sel, doc); return; }
  if (D.gt) { const x = S.grocery[D.gt]; if (x) put("grocery", D.gt, {...x, done: !x.done}); return; }
  if (D.gd) { del("grocery", D.gd); return; }
  if (D.gclear !== undefined) { Object.entries(S.grocery).forEach(([id, x]) => x.done && del("grocery", id)); return; }
  if (D.nd) { del("notes", D.nd); return; }
  if (D.pd) { const p = {...places()}; delete p[D.pd]; put("settings", "main", {...main(), places: p}); return; }
  if (D.drv) { const cur = drivers(), n = cur.includes(D.drv) ? cur.filter(x => x !== D.drv) : [...cur, D.drv]; put("settings", "main", {...main(), drivers: n}); return; }
  if (D.close !== undefined) { close(); return; }
  // chores
  if (D.ck) { const [d, k, who] = D.ck.split("|"), doc = {...(S.chorelog[d] || {})}; if (doc[k]) delete doc[k]; else doc[k] = { by: who, checkedBy: me || who, ts: Date.now() }; put("chorelog", d, doc); return; }
  if (D.ce) { choreSheet(D.ce); return; }
  if (D.chadd !== undefined) { choreSheet(null); return; }
  if (D.chpreset !== undefined) { chorePreset(); return; }
  if (D.cd) { grabChore(); const i = +D.cd; cform.days = cform.days.includes(i) ? cform.days.filter(x => x !== i) : [...cform.days, i].sort(); drawChore(); return; }
  if (D.cp) { grabChore(); cform.pool = cform.pool.includes(D.cp) ? cform.pool.filter(x => x !== D.cp) : [...cform.pool, D.cp]; drawChore(); return; }
  if (D.csave !== undefined) { grabChore(); const c = cform; if (!c.name.trim() || !c.days.length || !c.pool.length) { $("#cErr").classList.remove("hide"); return; } const id = c._id || uid("c"), out = {...c, name: c.name.trim()}; delete out._id; put("chores", id, out); close(); return; }
  if (D.cdel !== undefined) { if (t.dataset.sure) { del("chores", cform._id); close(); return; } t.dataset.sure = "1"; t.textContent = "Tap again to delete"; return; }
  // teams
  if (D.team !== undefined) { teamSheet(D.team || null); return; }
  if (D.tlogox !== undefined) { grabTeam(); tform.logo = ""; drawTeam(); return; }
  if (D.tsave !== undefined) {
    grabTeam(); const tf = tform; if (!tf.name.trim()) { $("#tErr").classList.remove("hide"); return; }
    const id = tf._id || uid("t"), out = { name: tf.name.trim(), short: tf.short || tf.name.trim().split(/\s+/).map(w => w[0]).join("").slice(0, 3).toUpperCase(), who: tf.who, c1: tf.c1, c2: tf.c2, logo: tf.logo || "" };
    if (out.who) Object.entries(teams()).forEach(([k, x]) => { if (k !== id && x.who === out.who) put("teams", k, {...(DEF_TEAMS[k] || {}), ...(S.teams[k] || {}), who: ""}); });
    put("teams", id, out); close(); return;
  }
  if (D.tdel !== undefined) { if (t.dataset.sure) { const id = tform._id; DEF_TEAMS[id] ? put("teams", id, { gone: true }) : del("teams", id); close(); return; } t.dataset.sure = "1"; t.textContent = "Tap again to delete"; return; }
  // event form
  if (D.fw) { grab(); form.who = form.who.includes(D.fw) ? form.who.filter(x => x !== D.fw) : [...form.who, D.fw]; if (form._auto) form.team = autoTeam(form); drawForm(); return; }
  if (D.fd) { grab(); const i = +D.fd; form.days = form.days.includes(i) ? form.days.filter(x => x !== i) : [...form.days, i]; drawForm(); return; }
  if (D.save !== undefined) {
    grab(); const f = form;
    if (!f.title.trim() || !f.who.length || !f.start || (f.repeat === "weekly" && !f.days.length)) { $("#fErr").classList.remove("hide"); return; }
    const id = f._id || uid("e"), out = {...f, title: f.title.trim(), travel: f.travel === "" ? "" : +f.travel, early: f.early === "" ? "" : +f.early};
    delete out._id; delete out._d; delete out._auto; delete out.leave;
    if (out.ride === "none" || out.ride === "from") out.driverTo = "";
    if (out.ride === "none" || out.ride === "to") out.driverFrom = "";
    if (out.repeat !== "weekly") { out.days = []; out.until = ""; }
    put("events", id, out);
    if (out.place && out.travel !== "" && places()[out.place] !== out.travel) put("settings", "main", {...main(), places: {...places(), [out.place]: out.travel}});
    if (!f._id) sel = out.date; close(); return;
  }
  if (D.skip !== undefined) { const e = S.events[form._id]; put("events", form._id, {...e, skip: [...(e.skip || []), form._d]}); close(); return; }
  if (D.delev !== undefined) { if (t.dataset.sure) { del("events", form._id); close(); return; } t.dataset.sure = "1"; t.textContent = "Tap again to delete for good"; return; }
});
document.addEventListener("change", async ev => {
  const id = ev.target.id;
  if (form && ["fR", "fRide", "fTeam", "fC"].includes(id)) { if (id === "fTeam") form._auto = false; grab(); if (id === "fC" && form._auto) form.team = autoTeam(form); drawForm(); }
  if (tform && id === "tLogo" && ev.target.files[0]) {
    grabTeam();
    try { tform.logo = await processLogo(ev.target.files[0], tform._strip); } catch (e) { flash("Couldn't read that image"); }
    drawTeam();
  }
});
document.addEventListener("input", ev => {
  if (form && ev.target.id === "fP") { const m = places()[ev.target.value.trim()], tr = $("#fTr"); if (m != null && tr && !tr.value) tr.value = m; }
});
document.addEventListener("mousedown", ev => { if (ev.target.id === "scrim") close(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") close(); });
document.addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id === "gAdd") { const v = $("#gIn").value.trim(); if (v) put("grocery", uid("g"), { text: v, by: me || "", done: false, ts: Date.now() }); }
  if (ev.target.id === "nAdd") { const v = $("#nIn").value.trim(); if (v) put("notes", uid("n"), { text: v, by: me || "", ts: Date.now() }); }
});

boot();
if (!me) setTimeout(whoSheet, 300);
}
</script>
